name: Portail OberA CI

on:
  push:
    branches: [codex/backend-socle]
  pull_request:
    branches: [codex/backend-socle, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portal:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: obera_ci
          POSTGRES_PASSWORD: demo_ci_only
          POSTGRES_DB: obera_beta_demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U obera_ci -d obera_beta_demo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://obera_ci:demo_ci_only@127.0.0.1:5432/obera_beta_demo
      EXTERNAL_TEST_DATABASE_URL: postgres://obera_ci:demo_ci_only@127.0.0.1:5432/obera_beta_demo
      EXTERNAL_DEMO_MODE: '1'
      PRIVATE_DOCUMENT_ROOT: /tmp/obera-ci-documents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend tests
        run: npm test
      - name: Frontend typecheck
        run: npx tsc --noEmit
      - name: Frontend build
        run: npm run build
      - name: Install backend dependencies
        working-directory: server
        run: npm ci
      - name: Backend typecheck
        working-directory: server
        run: npm run typecheck
      - name: Apply published migrations to integration database
        working-directory: server
        run: npm run migrate
      - name: Seed fictional integration data
        working-directory: server
        run: npm run seed:external-demo
      - name: Backend and PostgreSQL integration tests
        working-directory: server
        run: npm test
